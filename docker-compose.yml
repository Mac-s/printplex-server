services:
  printplex:
    build: .
    container_name: printplex-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # ⚠️ Un seul point de montage générique (façon Plex) — PAS iCloud Drive,
      # un dossier accessible au démon Docker (disque local, NAS…).
      # Lecture-écriture : le serveur maintient les info.json des projets.
      # Les bibliothèques elles-mêmes (quels sous-dossiers scanner) se
      # configurent ensuite depuis Réglages → Bibliothèque dans l'interface web.
      - ${PRINTPLEX_MEDIA:-./Media}:/media
      # Plusieurs disques/emplacements séparés ? Montez-les chacun sous /media
      # (comme Plex) plutôt qu'ailleurs — chaque bibliothèque ajoutée depuis
      # Réglages doit rester sous ce seul point de montage :
      #   - /mnt/nas/Figurines:/media/Figurines
      #   - /mnt/disque2/Posters:/media/Posters
      - printplex-data:/data
    environment:
      PRINTPLEX_MEDIA_PATH: /media
      PRINTPLEX_DATA_PATH: /data
      PRINTPLEX_SCAN_INTERVAL_MIN: "15"
      # PUID/PGID (façon linuxserver.io) : l'utilisateur du conteneur adopte cet
      # UID/GID au démarrage, pour lire/écrire /media et /data sans avoir à
      # chown/chmod ces dossiers côté hôte. Mets l'UID/GID de l'utilisateur qui
      # possède déjà ces dossiers sur ta machine (`id -u` / `id -g`).
      PUID: "1000"
      PGID: "1000"
      # Optionnel — intégration Shopify :
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
      # Compte administrateur du tableau de bord web — n'est utilisé que
      # tant qu'aucun compte n'existe encore (premier démarrage) ; ensuite
      # c'est éditable depuis Réglages → Compte et ces variables n'ont plus
      # d'effet. Si tu ne les fournis pas, la première visite du tableau de
      # bord propose de créer le compte directement dans l'interface.
      PRINTPLEX_ADMIN_USERNAME: ${PRINTPLEX_ADMIN_USERNAME:-}
      PRINTPLEX_ADMIN_PASSWORD: ${PRINTPLEX_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  printplex-data:
