services:
  printplex:
    build: .
    container_name: printplex-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # ⚠️ La bibliothèque doit être un dossier accessible au démon Docker
      # (disque local, NAS…) — PAS iCloud Drive. Lecture-écriture car le
      # serveur maintient les info.json des projets.
      - ${PRINTPLEX_LIBRARY:-./Library}:/library
      - printplex-data:/data
    environment:
      PRINTPLEX_LIBRARY_PATH: /library
      PRINTPLEX_DATA_PATH: /data
      PRINTPLEX_SCAN_INTERVAL_MIN: "15"
      # Optionnel — intégration Shopify :
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  printplex-data:
